<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folha — Tornang</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="with-rail">
<aside class="rail" id="rail">
  <div class="rail-logo" id="railLogo">🏭</div>
  <nav class="rail-nav">
    <a class="rail-item" href="dashboard.html" title="Dashboard">📊<span class="rail-label">Dashboard</span></a>
    <div class="rail-sep"></div>
    <div id="locIcons"></div>
    <div class="rail-sep"></div>
    <a class="rail-item" href="locations.html" title="Gerenciar Locais">📍<span class="rail-label">Gerenciar Locais</span></a>
    <button class="rail-item" id="driversBtn" title="Gerenciar Motoristas">🚚<span class="rail-label">Motoristas</span></button>
  </nav>
</aside>
<div class="topbar">
  <h1>Tornang — <span id="companyName"></span></h1>
  <div class="topbar-right">
    <div class="menu-wrap">
      <button class="chip" id="chipBtn">
        <span class="avatar" id="chipAvatar"></span>
        <span class="chip-name" id="chipName"></span>
      </button>
      <div class="dropdown" id="userMenu" hidden>
        <button class="dropdown-item" data-go="company.html">🏢 Minha empresa</button>
        <button class="dropdown-item" data-go="account.html">👤 Meu usuário</button>
        <hr>
        <button class="dropdown-item danger" id="menuLogout">Sair</button>
      </div>
    </div>
  </div>
</div>

<main class="pj-wrap">
  <div class="pj-backrow">
    <a class="pj-back" href="manager.html">← Projetos</a>
    <span class="pj-crumb" id="pjCrumb"></span>
  </div>

  <section class="pj-card pj-hero" id="pjHero">
    <p class="empty">Carregando folha…</p>
  </section>

  <div class="pj-cols">
    <section class="pj-card pj-main">
      <div class="pj-tabs" id="pjTabs">
        <button class="pj-tab active" data-tab="work">Trabalho</button>
        <button class="pj-tab" data-tab="files">Arquivos <span class="pj-tabcount" id="pjDocCount" hidden>0</span></button>
        <button class="pj-tab" data-tab="notes">Anotações <span class="pj-tabcount" id="pjNoteCount" hidden>0</span></button>
        <button class="pj-tab" data-tab="activity">Atividade</button>
        <button class="pj-tab" data-tab="members">Membros</button>
      </div>
      <div class="pj-tabbody" id="pjTabBody">
        <p class="empty">Conteúdo das abas chega no próximo passo.</p>
      </div>
    </section>
    <aside class="pj-side">
      <div class="pj-card pj-sidecard" id="pjNotesCard"><p class="empty">Anotações — próximo passo.</p></div>
      <div class="pj-card pj-sidecard" id="pjActivityCard"><p class="empty">Atividade recente — próximo passo.</p></div>
      <div class="pj-card pj-sidecard" id="pjMembersCard"><p class="empty">Membros — a carregar…</p></div>
      <div class="pj-card pj-sidecard" id="pjControlsCard"><p class="empty">Controles — próximo passo.</p></div>
    </aside>
  </div>
</main>
<div class="pj-viewer" id="pjViewer" hidden>
  <div class="pj-viewer-top">
    <div class="pj-viewer-title"><span id="pjViewerName"></span><span class="pj-viewer-count" id="pjViewerCount"></span></div>
    <div class="pj-viewer-actions">
      <a class="btn ghost small" id="pjViewerDl" href="#" target="_blank">⬇️ Baixar</a>
      <button class="btn ghost small" id="pjViewerClose">✕ Fechar</button>
    </div>
  </div>
  <button class="pj-viewer-nav prev" id="pjViewerPrev" aria-label="Anterior">‹</button>
  <button class="pj-viewer-nav next" id="pjViewerNext" aria-label="Próximo">›</button>
  <div class="pj-viewer-body" id="pjViewerBody"></div>
</div>
<div class="pj-modal-wrap" id="pjModal" hidden>
  <div class="pj-modal">
    <div class="pj-modal-head"><h3 id="pjModalTitle"></h3><button class="pj-modal-close" id="pjModalClose" title="Fechar">✕</button></div>
    <div class="pj-modal-body" id="pjModalBody"></div>
    <div class="pj-modal-foot" id="pjModalFoot"></div>
  </div>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = 'index.html';
const user = JSON.parse(localStorage.getItem('user') || '{}');
const company = JSON.parse(localStorage.getItem('company') || '{}');
if (user.role !== 'manager') location.href = 'worker.html';
document.getElementById('companyName').textContent = company.name;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erro');
  return data;
}
function fmtDate(d) { return d ? String(d).slice(0, 10).split('-').reverse().join('/') : '—'; }
function projectLabel(p) { return p.name ? p.client_name + ' — ' + p.name : p.client_name; }
const HIST_LABELS = { created: 'Folha criada', accepted: 'Assumida', finished: 'Concluída', passed: 'Passada para', released: 'Liberada para produção', route_updated: 'Rota atualizada', task_accepted: 'Tarefa assumida', task_done: 'Tarefa concluída', archived: 'Arquivada', unarchived: 'Desarquivada', items_added: 'Itens adicionados', docs_added: 'Documentos adicionados', doc_deleted: 'Documento excluído' };
function fmtDateTime(s) { return s ? String(s).slice(0, 16).replace('T', ' ') : '—'; }
function timeAgo(s) {
  if (!s) return '—';
  const d = new Date(s), diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (isNaN(diff)) return String(s).slice(0, 16).replace('T', ' ');
  if (diff < 60) return 'agora';
  if (diff < 3600) return 'há ' + Math.floor(diff / 60) + 'min';
  if (diff < 86400) return 'há ' + Math.floor(diff / 3600) + 'h';
  if (diff < 172800) return 'ontem';
  return String(s).slice(0, 10).split('-').reverse().join('/');
}
const NOTE_ICONS = { 'Problema mecânico': '🔧', 'Falta de material': '📦', 'Aguardando cliente': '⏳', 'Alerta geral': '⚠️', 'Emergência médica': '🚑', 'Incêndio': '🔥' };
function updateNoteCount() {
  const nc = document.getElementById('pjNoteCount');
  nc.textContent = (PJ.notes || []).length;
  nc.hidden = !(PJ.notes || []).length;
}

// ===== Estado da página =====
const folhaId = Number(new URLSearchParams(location.search).get('id'));
let PJ = null;

function ringSvg(pct) {
  const val = pct == null ? '—' : pct + '%';
  const dash = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  return `<svg class="pj-ring" viewBox="0 0 42 42" width="72" height="72" role="img" aria-label="${val} concluído">
    <circle cx="21" cy="21" r="15.9155" fill="none" stroke="#ECEEF2" stroke-width="4.5"></circle>
    ${dash > 0 ? `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#3859F6" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${dash} ${100 - dash}" stroke-dashoffset="25"></circle>` : ''}
    <text x="21" y="25" text-anchor="middle" font-size="9.5" font-weight="800" fill="#202433">${val}</text>
  </svg>`;
}

function statusPill(p) {
  return p.status === 'completed' ? '<span class="pj-badge green">Concluída</span>'
    : p.status === 'at_warehouse' ? '<span class="pj-badge blue">📦 No armazém</span>'
    : p.status === 'delivered' ? '<span class="pj-badge green">🚚 Entregue</span>'
    : p.status === 'pending_release' ? '<span class="pj-badge gray">Aguardando liberação</span>'
    : '<span class="pj-badge orange">Em produção</span>';
}

function renderHero() {
  const { p, items } = PJ;
  const tasks = (items || []).flatMap(it => it.tasks || []);
  const done = tasks.filter(t => t.status === 'done').length;
  const pct = tasks.length ? Math.round(done / tasks.length * 100) : null;
  document.title = projectLabel(p) + ' — Tornang';
  document.getElementById('pjCrumb').textContent = projectLabel(p);
  const docCount = document.getElementById('pjDocCount');
  docCount.textContent = (PJ.documents || []).length;
  docCount.hidden = false;
  document.getElementById('pjHero').innerHTML = `
    <div class="pj-pills">
      ${statusPill(p)}
      ${['completed', 'at_warehouse', 'delivered'].includes(p.status)
        ? (p.priority ? '<span class="pj-badge red">⚠️ Urgente</span>' : '')
        : `<button class="pj-badge ${p.priority ? 'red' : 'gray'} pj-pill-btn" onclick="togglePriority()" title="${p.priority ? 'Remover urgência' : 'Marcar como urgente'}">${p.priority ? '⚠️ Urgente' : 'Marcar urgente'}</button>`}
          ${p.archived ? '<span class="pj-badge gray">🗄️ Arquivada</span>' : ''}
      ${p.status === 'pending_release' ? '<button class="btn primary small" onclick="releaseFolha()">Liberar para produção</button>' : ''}
    </div>
    <div class="pj-hero-grid">
      <div>
        <h1 class="pj-name">${esc(p.name || p.client_name)}</h1>
        ${p.description ? `<p class="pj-desc">${esc(p.description)}</p>` : ''}
      </div>
      <div class="pj-completion">
        ${ringSvg(pct)}
        <div><b>${done} de ${tasks.length}</b><span class="sub">tarefas concluídas</span></div>
      </div>
    </div>
    <div class="pj-meta">
      <div class="pj-meta-item"><div class="k">Cliente</div><div class="v">${esc(p.client_name)}</div></div>
      <div class="pj-meta-item"><div class="k">Prazo</div><div class="v">${fmtDate(p.due_date)}</div></div>
      <div class="pj-meta-item"><div class="k">Responsável</div><div class="v">${esc(p.worker_name || 'Aguardando')}</div></div>
      <div class="pj-meta-item"><div class="k">Criada em</div><div class="v">${fmtDate(p.created_at)}</div></div>
    </div>`;
}

// ===== Abas =====
let currentTab = 'work';
document.querySelectorAll('.pj-tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.pj-tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentTab = t.dataset.tab;
  renderTab();
}));
function switchTab(name) {
  const t = document.querySelector('.pj-tab[data-tab="' + name + '"]');
  if (t) t.click();
}
function renderTab() {
  const el = document.getElementById('pjTabBody');
  if (currentTab === 'work') renderWorkTab(el);
  else if (currentTab === 'files') renderFilesTab(el);
  else if (currentTab === 'notes') renderNotesTab(el);
  else if (currentTab === 'members') renderMembersTab(el);
  else renderActivityTab(el);
}

function docTile(d, i) {
  const finished = ['completed', 'at_warehouse', 'delivered'].includes(PJ.p.status);
  return `<div class="doc-tile" title="Clique para visualizar" onclick="openViewer(${i})">
    ${(d.mime_type || '').startsWith('image/')
      ? `<img class="doc-thumb" src="/api/documents/${d.id}/file?token=${token}" alt="" loading="lazy">`
      : `<div class="doc-thumb icon">${(d.mime_type || '').includes('pdf') ? '📕' : '📄'}</div>`}
    <div class="doc-name" title="${esc(d.original_name)}">${esc(d.original_name)}</div>
    <div class="doc-actions">
      <a class="btn ghost small" href="/api/documents/${d.id}/file?token=${token}&dl=1" onclick="event.stopPropagation()">Baixar</a>
      ${finished ? '' : `<button class="btn ghost small" onclick="event.stopPropagation(); deleteDoc(${d.id})">Excluir</button>`}
    </div>
  </div>`;
}

function renderWorkTab(el) {
  const { p, items } = PJ;
  const finished = ['completed', 'at_warehouse', 'delivered'].includes(p.status);
  const itemsHtml = (items || []).length ? items.map(it => {
    const total = (it.tasks || []).length;
    const done = (it.tasks || []).filter(t => t.status === 'done').length;
    return `<div class="pj-item">
      <div class="pj-item-head">
        <span class="pj-check ${it.status === 'done' ? 'done' : 'todo'}">✓</span>
        <span class="pj-item-name">${esc(it.name)}${it.quantity > 1 ? ' ×' + it.quantity : ''}</span>
        <span class="pj-item-count">${done}/${total} tarefas</span>
      </div>
      ${(it.tasks || []).map(t => `
        <div class="pj-task">
          <span class="pj-check ${t.status === 'done' ? 'done' : 'todo'}">✓</span>
          <span class="pj-task-name ${t.status === 'done' ? 'is-done' : ''}">${esc(t.name)}</span>
          ${t.section_name ? `<span class="pj-task-sec">${esc(t.section_name)}</span>` : ''}
          ${t.assigned_name ? avaHtml(t.assigned_name) : ''}
        </div>`).join('') || '<p class="empty" style="font-size:12px;margin:4px 0 0">Sem tarefas neste item.</p>'}
    </div>`;
  }).join('') : '<p class="empty">Esta folha não tem itens ainda.</p>';
  el.innerHTML = `
    <div class="pj-section-head"><h2 class="pj-section-title">Itens e tarefas</h2>
      ${finished ? '' : '<button class="btn primary small" onclick="openAddItem()">+ Adicionar item</button>'}</div>
    ${itemsHtml}`;
}

function renderFilesTab(el) {
  const { documents } = PJ;
  el.innerHTML = `
    <div class="pj-dropzone" id="pjDropzone">⬆️ Clique ou arraste seus arquivos
      <input type="file" id="pjFiles" multiple hidden>
    </div>
    ${documents.length ? '<div class="doc-grid">' + documents.map((d, i) => docTile(d, i)).join('') + '</div>'
      : '<p class="empty">Nenhum documento anexado ainda.</p>'}`;
  wireDropzone();
}

function renderActivityTab(el) {
  const h = PJ.history || [];
  const rows = h.map(e => `
    <div class="pj-act">
      <span class="pj-act-dot"></span>
      <div class="pj-act-body">
        <div class="pj-act-title">${esc(HIST_LABELS[e.action] || e.action)}${e.worker_name ? ` <span class="pj-act-who">· ${esc(e.worker_name)}</span>` : ''}</div>
        ${e.notes ? `<div class="pj-act-notes">${esc(e.notes)}</div>` : ''}
        <div class="pj-act-time">${fmtDateTime(e.created_at)}</div>
      </div>
    </div>`).join('');
  el.innerHTML = `
    <div class="pj-section-head"><h2 class="pj-section-title">Atividade</h2>
      <button class="btn ghost small" onclick="downloadHistory()">⬇️ Baixar CSV</button></div>
    ${rows || '<p class="empty">Sem atividade registrada ainda.</p>'}`;
}
async function downloadHistory() {
  try {
    const res = await fetch('/api/projects/' + folhaId + '/history/download', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) return alert('Erro ao gerar o histórico.');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'historico-' + folhaId + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (err) { alert(err.message); }
}

function renderActivityCard() {
  const el = document.getElementById('pjActivityCard');
  const h = (PJ.history || []).slice(0, 4);
  el.innerHTML = `<div class="pj-section-head" style="margin:0 0 10px"><h2 class="pj-section-title" style="font-size:14px">Atividade recente</h2></div>
    ${h.length ? h.map(e => `<div class="pj-act-mini"><b>${esc(HIST_LABELS[e.action] || e.action)}</b>${e.worker_name ? ` <span class="pj-act-who">· ${esc(e.worker_name)}</span>` : ''}<div class="pj-act-time">${fmtDateTime(e.created_at)}</div></div>`).join('') : '<p class="empty">Nada ainda.</p>'}
    <button class="btn ghost small" style="margin-top:10px" onclick="switchTab('activity')">Ver histórico completo</button>`;
}
function renderNotesCard() {
  const el = document.getElementById('pjNotesCard');
  const notes = PJ.notes || [];
  const last = notes.slice(0, 2);
  el.innerHTML = `<div class="pj-section-head" style="margin:0 0 10px"><h2 class="pj-section-title" style="font-size:14px">Anotações</h2>
    <button class="btn ghost small" onclick="switchTab('notes')">Ver todas</button></div>
    ${last.length ? last.map(n => `<div class="pj-act-mini"><b>${esc(n.author_name || '?')}</b>${n.is_alert ? ` <span class="pj-note-alert">${NOTE_ICONS[n.alert_type] || '⚠️'}</span>` : ''}<div class="pj-note-text" style="font-size:11.5px;margin-top:2px">${esc((n.note || '').slice(0, 80))}${(n.note || '').length > 80 ? '…' : ''}</div></div>`).join('') : '<p class="empty">Nenhuma ainda.</p>'}`;
}
// ===== Aba Anotações =====
let notesFilter = 'all';
function renderNotesTab(el) {
  const notes = PJ.notes || [];
  const filtered = notesFilter === 'alerts' ? notes.filter(n => n.is_alert)
    : notesFilter === 'chat' ? notes.filter(n => !n.is_alert) : notes;
  const chip = (key, label) => `<button class="pj-chip ${notesFilter === key ? 'on' : ''}" onclick="notesFilter='${key}';renderTab()">${label}</button>`;
  el.innerHTML = `
    <div class="pj-section-head"><h2 class="pj-section-title">Anotações</h2>
      <div class="pj-chips">${chip('all', 'Todas')}${chip('alerts', 'Alertas')}${chip('chat', 'Conversa')}</div></div>
    <div class="pj-note-composer">
      <textarea id="pjNoteText" rows="3" placeholder="Adicionar nota…"></textarea>
      <button class="btn primary small" onclick="saveNote()">Enviar</button>
    </div>
    ${filtered.length ? filtered.map(n => `
      <div class="pj-note-big ${n.is_alert ? 'is-alert' : ''}">
        <div class="pj-note-head">
          ${n.author_name ? avaHtml(n.author_name) : '<span class="pj-ava">?</span>'}
          <div class="pj-note-meta"><b>${esc(n.author_name || '?')}</b>
            <span class="pj-act-time" title="${esc(fmtDateTime(n.created_at))}">${timeAgo(n.created_at)}</span></div>
          ${n.is_alert ? `<span class="pj-note-alert">${NOTE_ICONS[n.alert_type] || '⚠️'} ${esc(n.alert_type || 'Alerta')}</span>` : ''}
          ${n.section_name ? `<span class="pj-task-sec">${esc(n.section_name)}</span>` : ''}
        </div>
        <div class="pj-note-text" style="font-size:13px">${esc(n.note || '')}</div>
      </div>`).join('') : '<p class="empty">Nenhuma anotação ainda — a primeira pode ser sua.</p>'}`;
}
async function saveNote() {
  const t = document.getElementById('pjNoteText').value.trim();
  if (!t) return;
  try {
    await api('/api/projects/' + folhaId + '/notes', { method: 'POST', body: JSON.stringify({ note: t }) });
    await reload();
  } catch (err) { alert(err.message); }
}
function renderControlsCard() {
  const el = document.getElementById('pjControlsCard');
  const p = PJ.p;
  el.innerHTML = `<div class="pj-section-head" style="margin:0 0 10px"><h2 class="pj-section-title" style="font-size:14px">Controles</h2></div>
    <p class="hint" style="margin:0 0 12px">Arquivar mantém o registro. Excluir remove permanentemente.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost small" onclick="toggleArchive()">${p.archived ? '↩️ Restaurar' : '🗄️ Arquivar'}</button>
      <button class="btn small pj-btn-danger" onclick="deleteFolha()">🗑️ Excluir</button>
    </div>`;
}
async function toggleArchive() {
  try {
    await api('/api/projects/' + folhaId + (PJ.p.archived ? '/unarchive' : '/archive'), { method: 'POST' });
    await reload();
  } catch (err) { alert(err.message); }
}
async function deleteFolha() {
  if (!confirm('Excluir esta folha para sempre? Os arquivos enviados vão para a pasta de excluídos no servidor, mas o histórico será apagado.')) return;
  try { await api('/api/projects/' + folhaId, { method: 'DELETE' }); location.href = 'manager.html'; } catch (err) { alert(err.message); }
}

// ===== Upload e exclusão de documentos =====
async function uploadFiles(files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  try {
    const res = await fetch('/api/projects/' + folhaId + '/documents', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'Erro'); }
    await reload();
  } catch (err) { alert(err.message); }
}
function wireDropzone() {
  const dz = document.getElementById('pjDropzone');
  if (!dz) return;
  const input = document.getElementById('pjFiles');
  input.addEventListener('change', () => uploadFiles(input.files));
  dz.addEventListener('click', () => input.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); uploadFiles(e.dataTransfer.files); });
}
async function deleteDoc(docId) {
  if (!confirm('Excluir este documento?')) return;
  try {
    await api('/api/documents/' + docId, { method: 'DELETE' });
    await reload();
  } catch (err) { alert(err.message); }
}
async function togglePriority() {
  try {
    await api('/api/projects/' + folhaId + '/priority', { method: 'POST' });
    await reload();
  } catch (err) { alert(err.message); }
}
async function releaseFolha() {
  try { await api('/api/projects/' + folhaId + '/release', { method: 'POST' }); await reload(); } catch (err) { alert(err.message); }
}
async function reload() {
  const detail = await api('/api/projects/' + folhaId + '/detail');
  PJ = { p: detail.project, documents: detail.documents || [], items: detail.items || [], sections: detail.sections || [], history: PJ.history || [], notes: PJ.notes || [] };
  try { const h = await api('/api/projects/' + folhaId + '/history'); PJ.history = h.history || []; } catch (e) {}
  try { PJ.notes = (await api('/api/projects/' + folhaId + '/notes')).notes || []; } catch (e) {}
  pjSig = signature(PJ);
  renderHero();
  renderMembersCard();
  renderActivityCard();
  renderNotesCard();
  renderControlsCard();
  updateNoteCount();
  renderTab();
}

// ===== Visualizador em tela cheia (estilo Drive) =====
let viewerIdx = 0;
function openViewer(i) {
  viewerIdx = i;
  renderViewer();
  document.getElementById('pjViewer').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  document.getElementById('pjViewer').hidden = true;
  document.getElementById('pjViewerBody').innerHTML = '';
  document.body.style.overflow = '';
}
function navViewer(dir) {
  const n = PJ.documents.length;
  if (!n) return;
  viewerIdx = (viewerIdx + dir + n) % n;
  renderViewer();
}
function renderViewer() {
  const d = PJ.documents[viewerIdx];
  const isImg = (d.mime_type || '').startsWith('image/');
  document.getElementById('pjViewerBody').innerHTML = isImg
    ? `<img src="/api/documents/${d.id}/file?token=${token}" alt="${esc(d.original_name)}" style="max-width:92vw;max-height:100%;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.55)">`
    : `<iframe src="/api/documents/${d.id}/file?token=${token}" style="width:min(1000px,92vw);height:100%;border:0;border-radius:10px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.55)"></iframe>`;
  document.getElementById('pjViewerName').textContent = d.original_name;
  document.getElementById('pjViewerCount').textContent = (viewerIdx + 1) + ' de ' + PJ.documents.length;
  document.getElementById('pjViewerDl').href = '/api/documents/' + d.id + '/file?token=' + token + '&dl=1';
  const one = PJ.documents.length < 2;
  document.getElementById('pjViewerPrev').hidden = one;
  document.getElementById('pjViewerNext').hidden = one;
}
document.getElementById('pjViewerClose').addEventListener('click', closeViewer);
document.getElementById('pjViewerPrev').addEventListener('click', () => navViewer(-1));
document.getElementById('pjViewerNext').addEventListener('click', () => navViewer(1));
document.getElementById('pjViewer').addEventListener('click', e => { if (e.target.id === 'pjViewer' || e.target.id === 'pjViewerBody') closeViewer(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('pjViewer').hidden) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowRight') navViewer(1);
  else if (e.key === 'ArrowLeft') navViewer(-1);
});

// ===== Modal: adicionar UM item com N tarefas =====
let naItem = null;
function openAddItem() {
  naItem = { name: '', quantity: 1, ordered: true, tasks: [{ name: '', section_id: PJ.sections && PJ.sections[0] ? PJ.sections[0].id : null }] };
  document.getElementById('pjModalTitle').textContent = 'Adicionar item';
  naRender();
  document.getElementById('pjModal').hidden = false;
}
function closePjModal() { document.getElementById('pjModal').hidden = true; }
function naRender() {
  document.getElementById('pjModalBody').innerHTML = `
    <div class="form-row">
      <div class="field"><label>Item</label><input placeholder="ex.: 30 placas de saída" value="${esc(naItem.name)}" oninput="naItem.name=this.value"></div>
      <div class="field" style="max-width:90px"><label>Qtd</label><input type="number" min="1" value="${naItem.quantity}" oninput="naItem.quantity=Number(this.value)||1"></div>
      <label style="display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:22px"><input type="checkbox" style="width:auto" ${naItem.ordered ? 'checked' : ''} onchange="naItem.ordered=this.checked;naRender()"> Ordenado</label>
    </div>
    <p class="hint" style="margin:2px 0 10px">Tarefas na ordem em que acontecem:</p>
    ${naItem.tasks.map((t, ti) => `
      <div class="form-row" style="margin-bottom:8px">
        <div class="field"><input placeholder="Tarefa ${naItem.ordered ? (ti + 1) + ' — ' : ''}(ex.: desenho, corte, pintura)" value="${esc(t.name)}" oninput="naItem.tasks[${ti}].name=this.value"></div>
        <div class="field"><select onchange="naItem.tasks[${ti}].section_id=Number(this.value)">
          <option value="">Seção...</option>
          ${PJ.sections.map(s => `<option value="${s.id}" ${t.section_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select></div>
        ${naItem.ordered ? `<button class="btn ghost small" onclick="naMoveTask(${ti},-1)" ${ti === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn ghost small" onclick="naMoveTask(${ti},1)" ${ti === naItem.tasks.length - 1 ? 'disabled' : ''}>↓</button>` : ''}
        <button class="btn ghost small" onclick="naRemoveTask(${ti})" ${naItem.tasks.length === 1 ? 'disabled' : ''}>✕</button>
      </div>`).join('')}
    <button class="btn ghost small" onclick="naAddTask()">+ Tarefa</button>`;
  document.getElementById('pjModalFoot').innerHTML = `
    <button class="btn ghost" onclick="closePjModal()">Cancelar</button>
    <button class="btn primary" onclick="naSave()">Salvar item</button>`;
}
function naAddTask() { naItem.tasks.push({ name: '', section_id: naItem.tasks[0] ? naItem.tasks[0].section_id : null }); naRender(); }
function naRemoveTask(ti) { naItem.tasks.splice(ti, 1); naRender(); }
function naMoveTask(ti, dir) {
  const j = ti + dir;
  if (j < 0 || j >= naItem.tasks.length) return;
  [naItem.tasks[ti], naItem.tasks[j]] = [naItem.tasks[j], naItem.tasks[ti]]; naRender();
}
async function naSave() {
  const item = {
    name: naItem.name.trim(),
    quantity: Math.max(1, Number(naItem.quantity) || 1),
    ordered: !!naItem.ordered,
    tasks: naItem.tasks.filter(t => t.name.trim() && t.section_id).map(t => ({ name: t.name.trim(), section_id: t.section_id }))
  };
  if (!item.name) return alert('Dê um nome ao item.');
  if (!item.tasks.length) return alert('O item precisa de pelo menos uma tarefa com seção.');
  try {
    await api('/api/projects/' + folhaId + '/items', { method: 'POST', body: JSON.stringify({ items: [item] }) });
    closePjModal();
    await reload();
  } catch (err) { alert(err.message); }
}
document.getElementById('pjModalClose').addEventListener('click', closePjModal);
document.getElementById('pjModal').addEventListener('click', e => { if (e.target.id === 'pjModal') closePjModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('pjModal').hidden) closePjModal(); });

// ===== Membros =====

const AVA_TINTS = [
  { bg: '#EAF0FE', fg: '#3859F6' },
  { bg: '#E8F7EE', fg: '#1D9E5F' },
  { bg: '#FEF3E6', fg: '#D97706' },
  { bg: '#F3EEFE', fg: '#7C3AED' },
  { bg: '#FDECEC', fg: '#DC2626' },
  { bg: '#E6F7F7', fg: '#0D9488' }
];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVA_TINTS[h % AVA_TINTS.length];
}
function avaHtml(name, cls) {
  const t = avatarColor(name);
  return `<span class="pj-ava ${cls || ''}" style="background:${t.bg};color:${t.fg}" title="${esc(name)}">${esc(memberInitials(name))}</span>`;
}
function memberInitials(name) { return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join(''); }
function memberData() {
  const map = new Map();
  const ensure = n => { if (!map.has(n)) map.set(n, { sections: new Set(), creator: false }); return map.get(n); };
  for (const h of PJ.history || []) if (h.worker_name) { if (h.action === 'created') ensure(h.worker_name).creator = true; else ensure(h.worker_name); }
  for (const it of PJ.items || []) for (const t of it.tasks || []) if (t.assigned_name) ensure(t.assigned_name).sections.add(t.section_name || 'Sem seção');
  if (PJ.p.worker_name) ensure(PJ.p.worker_name);
  return map;
}
function renderMembersCard() {
  const el = document.getElementById('pjMembersCard');
  const names = [...memberData().keys()];
  const balls = names.map(n => avaHtml(n, 'pj-ava-stack')).join('');
  el.innerHTML = `<div class="pj-section-head" style="margin:0 0 12px"><h2 class="pj-section-title" style="font-size:14px">Membros</h2>
    <button class="btn ghost small" onclick="switchTab('members')">Ver todos</button></div>
    ${balls ? `<div class="pj-member-stack">${balls}</div>` : '<p class="empty">Ninguém ainda.</p>'}`;
}

function renderMembersTab(el) {
  const map = memberData();
  const cards = [...map.entries()].map(([name, m]) => `
    <div class="pj-member-card">
      ${avaHtml(name, 'pj-ava-xl')}
      <div class="pj-member-info">
        <div class="pj-member-name">${esc(name)}${m.creator ? ' <span class="pj-creator-pill">Criador</span>' : ''}</div>
        ${m.sections.size ? `<div class="pj-member-secs">${[...m.sections].map(esc).join(' · ')}</div>` : ''}
      </div>
    </div>`).join('');
  el.innerHTML = cards
    ? '<div class="pj-section-head"><h2 class="pj-section-title">Membros do projeto</h2></div><div class="pj-members-grid">' + cards + '</div>'
    : '<p class="empty">Ninguém trabalhou nesta folha ainda.</p>';
}

// ===== Chip do usuário =====
function setAvatar(el, withDot) {
  el.innerHTML = (user.avatar ? `<img src="${esc(user.avatar)}" alt="Foto de perfil">` : `<span class="avatar-initial">${esc((user.name || '?').trim()[0].toUpperCase())}</span>`) + (withDot ? '<span class="status-dot"></span>' : '');
}
setAvatar(document.getElementById('chipAvatar'), true);
document.getElementById('chipName').textContent = user.name || '';
const userMenu = document.getElementById('userMenu');
document.getElementById('chipBtn').addEventListener('click', e => { e.stopPropagation(); userMenu.hidden = !userMenu.hidden; });
document.addEventListener('click', () => userMenu.hidden = true);
document.querySelectorAll('.dropdown-item').forEach(b => b.addEventListener('click', () => location.href = b.dataset.go));
document.getElementById('menuLogout').addEventListener('click', async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  localStorage.clear();
  location.href = 'index.html';
});

// ===== Rail: logo + locais =====
(async () => {
  try {
    const { company: c } = await api('/api/company');
    if (c.logo) document.getElementById('railLogo').innerHTML = `<img src="/${esc(c.logo)}" alt="">`;
    const { locations: locs } = await api('/api/locations');
    const box = document.getElementById('locIcons');
    locs.forEach(l => {
      const b = document.createElement('button');
      b.className = 'rail-item loc';
      b.title = l.name;
      b.innerHTML = `<span class="rail-ico">${l.image ? `<img src="${esc(l.image)}" alt="">` : esc((l.name || '?').trim()[0].toUpperCase())}</span><span class="rail-label">${esc(l.name)}</span>`;
      b.addEventListener('click', () => location.href = 'manager.html?loc=' + l.id);
      box.appendChild(b);
    });
  } catch (e) {}
})();

// ===== Load =====
(async () => {
  if (!folhaId) { location.href = 'manager.html'; return; }
  try {
    const detail = await api('/api/projects/' + folhaId + '/detail');
    PJ = { p: detail.project, documents: detail.documents || [], items: detail.items || [], sections: detail.sections || [], history: [], notes: [] };
    try { const h = await api('/api/projects/' + folhaId + '/history'); PJ.history = h.history || []; } catch (e) {}
    try { PJ.notes = (await api('/api/projects/' + folhaId + '/notes')).notes || []; } catch (e) {}
    pjSig = signature(PJ);
    renderHero();
    renderMembersCard();
    renderActivityCard();
    renderNotesCard();
    renderControlsCard();
    updateNoteCount();
    renderTab();
  } catch (err) {
    document.getElementById('pjHero').innerHTML = '<p class="empty">Folha não encontrada. <a href="manager.html">Voltar para projetos</a>.</p>';
  }
})();

// ===== Auto-atualização (3s, como nas outras páginas) =====
let pjSig = '';
function signature(s) {
  const tasks = (s.items || []).flatMap(it => it.tasks || []);
  return JSON.stringify([s.p.status, s.p.priority, s.p.assigned_to, s.p.worker_name,
    (s.documents || []).map(d => d.id).join(','),
    tasks.map(t => t.status + ':' + (t.assigned_name || '')).join(','),
    (s.notes || []).map(n => (n.note || '').length + ':' + (n.author_name || '')).join('|')]);
}
function pjBusy() {
  const ae = document.activeElement;
  return !document.getElementById('pjModal').hidden || !document.getElementById('pjViewer').hidden
    || (ae && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName));
}
setInterval(async () => {
  if (document.hidden || pjBusy()) return;
  try {
    const detail = await api('/api/projects/' + folhaId + '/detail');
    const next = { p: detail.project, documents: detail.documents || [], items: detail.items || [], sections: detail.sections || [], history: PJ.history || [] };
    const sig = signature(next);
    if (sig === pjSig) return;
    try { next.history = (await api('/api/projects/' + folhaId + '/history')).history || []; } catch (e) {}
    PJ = next; pjSig = sig;
    renderHero(); renderMembersCard(); renderTab();
  } catch (e) {}
}, 3000);
</script>
