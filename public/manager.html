<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerente — Tornang</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="with-rail">
<aside class="rail" id="rail">
  <div class="rail-logo" id="railLogo">🏭</div>
  <nav class="rail-nav">
    <a class="rail-item" href="dashboard.html" title="Dashboard">📊<span class="rail-label">Dashboard</span></a>
    <div class="rail-sep"></div>
    <div id="locIcons"></div>
    <div class="rail-sep"></div>
    <a class="rail-item" href="locations.html" title="Gerenciar Locais">📍<span class="rail-label">Gerenciar Locais</span></a>
    <button class="rail-item" id="driversBtn" title="Gerenciar Motoristas">🚚<span class="rail-label">Motoristas</span></button>
  </nav>
  <div class="flyout" id="flyout" hidden>
    <div class="flyout-title" id="flyoutTitle"></div>
<a class="flyout-link" id="flyProjects" href="#">📁 Projetos</a>
<a class="flyout-link" id="flyGroups" href="#">👥 Trabalhadores</a>
<a class="flyout-link" id="flySections" href="#">🗂️ Seções</a>
  </div>
</aside>
<div class="topbar">
  
    <h1>Tornang — <span id="companyName"></span><span id="locName" class="muted" style="font-weight:400"></span></h1>
  <div class="topbar-right">
    <div class="bell-wrap">
      <button class="bell" id="bellBtn" aria-label="Notificações">🔔<span class="badge" id="bellBadge" hidden>0</span></button>
      <div class="notif-panel" id="notifPanel" hidden>
        <div class="notif-empty">Sem notificações por enquanto.</div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="chip" id="chipBtn">
        <span class="avatar" id="chipAvatar"></span>
        <span class="chip-name" id="chipName"></span>
      </button>
      <div class="dropdown" id="userMenu" hidden>
        <button class="dropdown-item" data-go="company.html">🏢 Minha empresa</button>
        <button class="dropdown-item" data-go="account.html">👤 Meu usuário</button>
        <button class="dropdown-item" data-go="collaborators.html">👥 Colaboradores</button>
        <hr>
        <button class="dropdown-item danger" id="menuLogout">Sair</button>

</div>
<div class="tabs">
  <button class="tab active" data-tab="projects">Projetos</button>
  <button class="tab" data-tab="workers">Trabalhadores</button>
  <button class="tab" data-tab="sections">Seções</button>
</div>
<div id="panel-projects" class="panel">
  <div class="toolbar">
    <input id="pSearch" placeholder="Buscar cliente ou projeto...">
    <select id="pStatusFilter">
  <option value="all">Todos os status</option>
  <option value="in_progress">Em produção</option>
  <option value="pending_release">Aguardando liberação</option>
  <option value="completed">Concluídas</option>
  <option value="at_warehouse">📦 No armazém</option>
  <option value="delivered">🚚 Entregues</option>
</select>
<select id="pSectionFilter"><option value="all">Todas as seções</option></select>
    <button class="btn primary" id="newProjectBtn" style="width:auto">+ Nova folha</button>
  </div>
  <div id="projectsTable"></div>
</div>
<div id="panel-workers" class="panel hidden">
  <div class="toolbar">
    <input id="wSearch" placeholder="Buscar trabalhador...">
    <select id="wSectionFilter"><option value="all">Todas as seções</option><option value="none">Sem seção</option></select>
    <select id="wStatusFilter"><option value="all">Todos os status</option><option value="online">Online</option><option value="offline">Offline</option></select>
    <button class="btn primary" id="newWorkerBtn" style="width:auto">+ Novo trabalhador</button>
  </div>
  <div id="workersList"></div>
</div>
<div id="panel-sections" class="panel hidden">
  <div class="form-row">
    <div class="field"><input id="sName" placeholder="Nome da nova seção"></div>
    <button class="btn primary" id="createSectionBtn" style="width:auto">Adicionar seção</button>
  </div>
  <div id="sectionsList"></div>
</div>
<div id="modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 class="modal-title" id="modalTitle"></h2>
      <button class="modal-close" id="modalClose" title="Fechar">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><div id="modalFooterLeft"></div><div id="modalFooterRight"></div></div>
  </div>
</div>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = 'index.html';
const user = JSON.parse(localStorage.getItem('user') || '{}');
const company = JSON.parse(localStorage.getItem('company') || '{}');
if (user.role !== 'manager') location.href = 'worker.html';
document.getElementById('companyName').textContent = company.name;
// Local atual (via ?loc= na URL) — precisa ficar no topo, visível para todas as funções
let currentLocId = Number(new URLSearchParams(location.search).get('loc')) || null;
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erro');
  return data;
}
// Tabs
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('panel-' + t.dataset.tab).classList.remove('hidden');
  if (t.dataset.tab === 'projects') loadProjects();
  if (t.dataset.tab === 'workers') loadWorkers();
  if (t.dataset.tab === 'sections') loadSections();
}));
// Modal
function openModal(title, bodyHtml, footerLeft = '', footerRight = '') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooterLeft').innerHTML = footerLeft;
  document.getElementById('modalFooterRight').innerHTML = footerRight;
  document.getElementById('modal').classList.remove('hidden');
}
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modal').classList.add('hidden'));
function fmtDate(d) { return d ? d.split('-').reverse().join('/') : '—'; }
function projectLabel(p) { return p.name ? p.client_name + ' — ' + p.name : p.client_name; }
// Projetos
async function loadProjects() {
  const q = currentLocId ? '?loc=' + currentLocId : '';
  const [{ projects }, { sections }] = await Promise.all([api('/api/projects' + q), api('/api/company/sections' + q)]);
  projectsCache = projects;
  sectionsCache = sections;
  const sel = document.getElementById('pSectionFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">Todas as seções</option>' + sections.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  sel.value = cur;
  renderProjects();
}
let projectsCache = [];
function renderProjects() {
const today = new Date().toISOString().split('T')[0];
const term = document.getElementById('pSearch').value.toLowerCase().trim();
const secF = document.getElementById('pSectionFilter').value;
const stF = document.getElementById('pStatusFilter').value;
const list = projectsCache.filter(p => {
  if (term && !((p.client_name || '').toLowerCase().includes(term) || (p.name || '').toLowerCase().includes(term))) return false;
  if (stF === 'completed' && !['completed', 'at_warehouse', 'delivered'].includes(p.status)) return false;
  if (stF !== 'all' && stF !== 'completed' && p.status !== stF) return false;
  if (secF !== 'all' && !String(p.route_ids || '').split(',').includes(secF)) return false;
  return true;
});
// e use `list` no lugar de projectsCache ao montar a tabela
  const el = document.getElementById('projectsTable');
  if (!list.length) { el.innerHTML = '<p class="empty">Nenhuma folha encontrada.</p>'; return; }
const statusInfo = p => p.status === 'completed' ? { cls: 'green', label: 'Concluída' }
  : p.status === 'at_warehouse' ? { cls: 'blue', label: '📦 No armazém' }
  : p.status === 'delivered' ? { cls: 'green', label: '🚚 Entregue' }
  : p.status === 'pending_release' ? { cls: 'gray', label: 'Aguardando liberação' }
  : { cls: 'orange', label: 'Em produção' };
  el.innerHTML = `<table><thead><tr><th></th><th>Cliente</th><th>Projeto</th><th>Status</th><th>Seção atual</th><th>Prazo</th><th>Documentos</th><th></th></tr></thead><tbody>` +
    list.map(p => {
      const st = statusInfo(p);
      const overdue = p.status !== 'completed' && p.due_date && p.due_date < today;
      return `<tr class="row-click ${p.priority ? 'urgent-row' : ''}" onclick="openDetail(${p.id})">
        <td>${p.priority ? '⚠️' : ''}</td>
        <td><b>${esc(p.client_name)}</b>${p.description ? `<br><small class="muted">${esc(p.description)}</small>` : ''}</td>
        <td>${p.name ? `<span class="badge blue">${esc(p.name)}</span>` : '—'}</td>
        <td><span class="badge ${st.cls}">${st.label}</span>${p.status === 'in_progress' && p.awaiting > 0 ? ' <span class="badge orange">⏳ Ninguém aceitou</span>' : ''}</td>
        <td>${p.status === 'in_progress' ? `<span class="badge blue">${esc(p.section_name || '—')}</span>` : '—'}</td>
        <td class="${overdue ? 'date-overdue' : ''}">${p.due_date ? esc(p.due_date.split('-').reverse().join('/')) : '—'}</td>
      <td>${p.doc_count} ${p.doc_count === 1 ? 'arquivo' : 'arquivos'}</td>
        <td><button class="icon-btn danger" title="Excluir folha" onclick="event.stopPropagation(); deleteProject(${p.id})">🗑</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';
}
document.getElementById('pSearch').addEventListener('input', renderProjects);
document.getElementById('pStatusFilter').addEventListener('change', renderProjects);
document.getElementById('pSectionFilter').addEventListener('change', renderProjects);
// ===== Construtor de rota (final — grip de arraste, sem setas) =====
let sectionsCache = [];
let routeSteps = [];   // [[sectionId,...], ...] — seções no mesmo array trabalham em paralelo
let routeDoneIds = []; // seções já concluídas (travadas no editor)
let routeBuilderId = null;
function sectionName(id) {
  const s = sectionsCache.find(x => x.id === id);
  return s ? s.name : '?';
}
function renderRouteBuilder() {
  const el = document.getElementById(routeBuilderId);
  if (!el) return;
  const used = new Set(routeSteps.flat());
  const checks = sectionsCache.map(s => {
    const done = routeDoneIds.includes(s.id);
    return `<label class="route-check"><input type="checkbox" ${done || used.has(s.id) ? 'checked' : ''} ${done ? 'disabled' : ''} onchange="toggleRouteSection(${s.id})"> ${esc(s.name)}${done ? ' ✅' : ''}</label>`;
  }).join('');
  const steps = routeSteps.map((step, i) => `
    <div class="route-step" data-i="${i}">
      <span class="drag-grip" draggable="true" title="Arraste para reordenar">⠿</span>
      <span class="route-step-no">Etapa ${i + 1}</span>
      <span class="route-step-names">${step.map(id => esc(sectionName(id))).join(' + ')}${step.some(id => routeDoneIds.includes(id)) ? ' ✅' : ''}</span>
      <span class="row-actions">
        ${step.length > 1
          ? `<button class="btn ghost small" onclick="splitStep(${i})">Separar</button>`
          : (i > 0 ? `<button class="btn ghost small" onclick="mergeStep(${i})">Juntar c/ anterior</button>` : '')}
        <button class="btn ghost small" onclick="removeStep(${i})" title="Remover a etapa inteira">✕</button>
      </span>
    </div>`).join('');
  el.innerHTML = `<div class="route-checks">${checks}</div><div class="route-steps">${steps || '<p class="empty">Marque seções acima para montar a rota.</p>'}</div>
    <p class="muted" style="font-size:12px;margin-top:8px">Marque as seções para adicioná-las (entram como nova etapa no fim). Arraste pelo ⠿ para reordenar, "Juntar c/ anterior" coloca a etapa em paralelo com a anterior, "Separar" desfaz e ✕ remove a etapa.</p>`;
  attachRouteDrag(el);
}

// ===== v5.0: construtor de itens e tarefas =====
let npItems = [];
let npSectionOptions = [];
let npSelectedSections = [];

function npAddItem() { npItems.push({ name: '', quantity: 1, ordered: true, tasks: [{ name: '', section_id: null }] }); renderItemsBuilder(); }
function npAddTask(i) { npItems[i].tasks.push({ name: '', section_id: npSectionOptions[0] ? npSectionOptions[0].id : null }); renderItemsBuilder(); }
function npRemoveItem(i) { npItems.splice(i, 1); renderItemsBuilder(); }
function npRemoveTask(i, ti) { npItems[i].tasks.splice(ti, 1); renderItemsBuilder(); }
function npMoveTask(i, ti, dir) {
  const arr = npItems[i].tasks, j = ti + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[ti], arr[j]] = [arr[j], arr[ti]]; renderItemsBuilder();
}
function renderItemsBuilder() {
  const el = document.getElementById('npItemsList');
  if (!npItems.length) { el.innerHTML = '<p class="empty">Nenhum item ainda.</p>'; return; }
  el.innerHTML = npItems.map((it, i) => `
    <div class="item" style="margin-bottom:10px">
      <div class="form-row">
        <div class="field"><input placeholder="Item (ex.: 30 placas de saída)" value="${esc(it.name)}" oninput="npItems[${i}].name=this.value"></div>
        <div class="field" style="max-width:80px"><input type="number" min="1" value="${it.quantity}" title="Quantidade" oninput="npItems[${i}].quantity=Number(this.value)||1"></div>
        <label style="display:flex;align-items:center;gap:6px;white-space:nowrap"><input type="checkbox" style="width:auto" ${it.ordered ? 'checked' : ''} onchange="npItems[${i}].ordered=this.checked;renderItemsBuilder()"> Ordenado</label>
        <button class="btn ghost small" onclick="npRemoveItem(${i})">🗑</button>
      </div>
      ${it.tasks.map((t, ti) => `
      <div class="form-row" style="margin-left:18px">
        <div class="field"><input placeholder="Tarefa ${it.ordered ? (ti + 1) + ' — ' : ''}(ex.: desenho, corte, pintura)" value="${esc(t.name)}" oninput="npItems[${i}].tasks[${ti}].name=this.value"></div>
        <div class="field"><select onchange="npItems[${i}].tasks[${ti}].section_id=Number(this.value)">
          <option value="">Seção...</option>
          ${npSectionOptions.map(s => `<option value="${s.id}" ${t.section_id === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select></div>
        ${it.ordered ? `<button class="btn ghost small" onclick="npMoveTask(${i},${ti},-1)" ${ti === 0 ? 'disabled' : ''}>↑</button>
        <button class="btn ghost small" onclick="npMoveTask(${i},${ti},1)" ${ti === it.tasks.length - 1 ? 'disabled' : ''}>↓</button>` : ''}
        <button class="btn ghost small" onclick="npRemoveTask(${i},${ti})">✕</button>
      </div>`).join('')}
      <button class="btn ghost small" style="margin:4px 0 0 18px" onclick="npAddTask(${i})">+ Tarefa</button>
    </div>`).join('');
}




function renderSectionBubbles(sections) {
  document.getElementById('npSectionBubbles').innerHTML = sections.map(s => {
    const on = npSelectedSections.includes(s.id);
    return `<button type="button" class="bubble ${on ? 'on' : ''}" onclick="toggleBubble(${s.id})">${esc(s.name)}<span>${on ? '−' : '+'}</span></button>`;
  }).join('');
}
function toggleBubble(id) {
  npSelectedSections = npSelectedSections.includes(id)
    ? npSelectedSections.filter(x => x !== id)
    : npSelectedSections.concat(id);
  renderSectionBubbles(sectionsCache);
}

function setupDropzone() {
  const dz = document.getElementById('npDropzone');
  const input = document.getElementById('npFiles');
  dz.onclick = () => input.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = () => dz.classList.remove('drag');
  dz.ondrop = e => {
    e.preventDefault(); dz.classList.remove('drag');
    try { input.files = e.dataTransfer.files; } catch (err) { input.files = null; }
    const n = e.dataTransfer.files.length;
    dz.querySelector('p').textContent = n ? n + ' arquivo(s) selecionado(s)' : 'Clique ou arraste seus arquivos aqui';
  };
  input.onchange = () => {
    const n = input.files.length;
    dz.querySelector('p').textContent = n ? n + ' arquivo(s) selecionado(s)' : 'Clique ou arraste seus arquivos aqui';
  };
}

function attachRouteDrag(el) {
  if (el.dataset.dragReady) return;
  el.dataset.dragReady = '1';
  let dragIdx = null;
  el.addEventListener('dragstart', e => {
    const grip = e.target.closest('.drag-grip');
    if (!grip) { e.preventDefault(); return; }
    const row = grip.closest('.route-step');
    dragIdx = Number(row.dataset.i);
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(dragIdx));
    requestAnimationFrame(() => row.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => {
    dragIdx = null;
    el.querySelectorAll('.dragging,.drag-over').forEach(n => n.classList.remove('dragging', 'drag-over'));
  });
  el.addEventListener('dragover', e => {
    const row = e.target.closest('.route-step');
    if (row && dragIdx !== null) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; row.classList.add('drag-over'); }
  });
  el.addEventListener('dragleave', e => {
    const row = e.target.closest('.route-step');
    if (row) row.classList.remove('drag-over');
  });
  el.addEventListener('drop', e => {
    const row = e.target.closest('.route-step');
    if (!row || dragIdx === null) return;
    e.preventDefault();
    let target = Number(row.dataset.i);
    if (target > dragIdx) target -= 1; // corrige o índice após remover o item arrastado
    if (target !== dragIdx) {
      const [moved] = routeSteps.splice(dragIdx, 1);
      routeSteps.splice(target, 0, moved);
      renderRouteBuilder();
    }
    dragIdx = null;
  });
}
function toggleRouteSection(id) {
  if (routeDoneIds.includes(id)) return;
  if (routeSteps.flat().includes(id)) {
    routeSteps = routeSteps.map(st => st.filter(x => x !== id)).filter(st => st.length);
  } else {
    routeSteps.push([id]);
  }
  renderRouteBuilder();
}
function mergeStep(i) { routeSteps[i - 1] = routeSteps[i - 1].concat(routeSteps[i]); routeSteps.splice(i, 1); renderRouteBuilder(); }
function splitStep(i) {
  routeSteps.splice(i, 1, ...routeSteps[i].map(id => [id]));
  renderRouteBuilder();
}
function removeStep(i) { routeSteps.splice(i, 1); renderRouteBuilder(); }
document.getElementById('newProjectBtn').addEventListener('click', async () => {
  const { sections } = await api('/api/sections' + (currentLocId ? '?loc=' + currentLocId : ''));
  if (!sections.length) return alert('Crie pelo menos uma seção antes de abrir folhas.');
  sectionsCache = sections;
  npItems = [];
  npSelectedSections = [];
  openModal('Nova folha de obra', `
    <div class="modal-scroll">
      <div class="grid2">
        <label>Cliente / Obra *<input type="text" id="npClient" required></label>
        <label>Nome do projeto *<input type="text" id="npName"></label>
      </div>
      <div class="grid2">
        <label>Prazo *<input type="date" id="npDue"></label>
        <label>Descrição (opcional)<input type="text" id="npDesc"></label>
      </div>
      <h3 style="font-size:14px;margin:14px 0 2px">Seções do projeto *</h3>
      <p class="hint">Toque em + para incluir a seção neste projeto.</p>
      <div id="npSectionBubbles" class="bubble-row"></div>
      <h3 style="font-size:14px;margin:14px 0 6px">Itens e tarefas</h3>
      <p class="hint">Cada item é uma parte do projeto (ex.: 30 placas de saída). Adicione as tarefas na ordem em que acontecem.</p>
      <div id="npItemsList"></div>
      <button class="btn ghost small" onclick="npAddItem()">+ Adicionar item</button>
      <h3 style="font-size:14px;margin:14px 0 6px">Documentos (opcional)</h3>
      <div id="npDropzone" class="dropzone">⬆️<p>Clique ou arraste seus arquivos aqui</p></div>
      <input type="file" id="npFiles" multiple hidden>
    </div>`,
    `<button class="btn primary" onclick="createProject()">Abrir folha</button>`);
  renderSectionBubbles(sections);
  renderItemsBuilder();
  setupDropzone();
});
async function createProject() {
  const client_name = document.getElementById('npClient').value.trim();
  const name = document.getElementById('npName').value.trim();
  const due_date = document.getElementById('npDue').value;
  if (!client_name) return alert('Informe o cliente.');
  if (!name) return alert('Informe o nome do projeto.');
  if (!due_date) return alert('Informe o prazo.');
  if (!npSelectedSections.length) return alert('Selecione pelo menos uma seção para o projeto.');
  const items = npItems.map(it => ({
    name: it.name.trim(),
    quantity: Math.max(1, Number(it.quantity) || 1),
    ordered: !!it.ordered,
    tasks: it.tasks.filter(t => t.name.trim() && t.section_id).map(t => ({ name: t.name.trim(), section_id: t.section_id }))
  })).filter(it => it.name);
  for (const it of items) {
    if (!it.tasks.length) return alert('O item "' + it.name + '" precisa de pelo menos uma tarefa com seção.');
  }
  try {
    const { id } = await api('/api/projects', { method: 'POST', body: JSON.stringify({
      client_name, name, due_date,
      description: document.getElementById('npDesc').value.trim(),
      location_id: currentLocId,
      section_ids: npSelectedSections,
      items
    })});
    const files = document.getElementById('npFiles').files;
    if (files.length) {
      const fd = new FormData();
      for (const f of files) fd.append('files', f);
      const res = await fetch('/api/projects/' + id + '/documents', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
      if (!res.ok) { const e = await res.json().catch(() => ({})); alert('Folha criada, mas houve erro no upload: ' + (e.error || '')); }
    }
    document.getElementById('modal').classList.add('hidden');
    loadProjects();
  } catch (err) { alert(err.message); }
}
async function openDetail(id) {
  const { project: p, documents } = await api('/api/projects/' + id + '/detail');
  const isImg = d => (d.mime_type || '').startsWith('image/');
  const docsHtml = documents.length
    ? '<div class="doc-grid">' + documents.map(d => `
      <div class="doc-tile" title="Clique para visualizar" onclick="window.open('/api/documents/${d.id}/file?token=${token}','_blank')">
        ${isImg(d)
          ? `<img class="doc-thumb" src="/api/documents/${d.id}/file?token=${token}" alt="">`
          : `<div class="doc-thumb icon">${(d.mime_type || '').includes('pdf') ? '📕' : '📄'}</div>`}
        <div class="doc-name" title="${esc(d.original_name)}">${esc(d.original_name)}</div>
        <div class="doc-actions">
          <a class="btn ghost small" href="/api/documents/${d.id}/file?token=${token}&dl=1" onclick="event.stopPropagation()">Baixar</a>

async function uploadFiles(projectId, files) {
  if (!files || !files.length) return;
  const all = Array.from(files);
  const msg = document.getElementById('docsMsg');
  let sent = 0, failed = 0;
  for (let i = 0; i < all.length; i += 10) {
    const fd = new FormData();
    for (const f of all.slice(i, i + 10)) fd.append('files', f);
    try {
      const res = await fetch('/api/projects/' + projectId + '/documents', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
      if (res.ok) sent += Math.min(10, all.length - i); else failed++;
    } catch (e) { failed++; }
  }
  if (msg) msg.textContent = failed ? sent + ' enviado(s), ' + failed + ' lote(s) falharam.' : sent + ' arquivo(s) enviado(s).';
  await openDetail(projectId);
  loadProjects();
}

  routeBuilderId = 'routeBuilderEdit';

async function showHistory(id) {
  const [data, detail] = await Promise.all([
    api('/api/projects/' + id + '/history'),
    api('/api/projects/' + id + '/detail')
  ]);
  const labels = { created: 'Folha criada', accepted: 'Assumida', finished: 'Concluída', passed: 'Passada para', released: 'Liberada para produção', route_updated: 'Rota atualizada', task_accepted: 'Tarefa assumida', task_done: 'Tarefa concluída' };
  // Timeline estilo rastreamento: pontos ligados por linha
  let timeline = '';
  if (detail.route && detail.route.length) {
    const byStep = {};
    for (const r of detail.route) (byStep[r.step] = byStep[r.step] || []).push(r);
    const nameOf = sid => (detail.sections.find(s => s.id === sid) || {}).name || '?';
    let currentSet = false;
    timeline = Object.keys(byStep).sort((a, b) => a - b).map(k => {
      const rows = byStep[k];
      const allDone = rows.every(r => r.status === 'done');
      const cls = allDone ? 'done' : (!currentSet ? (currentSet = true, 'current') : 'pending');
      return `<div class="t-step ${cls}"><span class="t-dot"></span><span class="t-label">${rows.map(r => esc(nameOf(r.section_id))).join(' + ')}</span></div>`;
    }).join('');
  } else {
    const visited = [];
    for (const h of data.history) if (h.section_name && !visited.includes(h.section_name)) visited.push(h.section_name);
    timeline = visited.map((name, i) => {
      const isCurrent = i === visited.length - 1 && data.project.status !== 'completed';
      return `<div class="t-step ${isCurrent ? 'current' : 'done'}"><span class="t-dot"></span><span class="t-label">${esc(name)}</span></div>`;
    }).join('');
  }
  const rows = data.history.map(h => `
    <tr><td>${esc(h.created_at)}</td><td>${esc(h.section_name || '—')}</td><td>${esc(h.worker_name || '—')}</td><td>${labels[h.action] || h.action}</td></tr>`).join('');
  openModal('Histórico — ' + projectLabel(data.project), `
    ${timeline ? `<div class="timeline">${timeline}</div>` : ''}
    <table><thead><tr><th>Data</th><th>Seção</th><th>Quem</th><th>Ação</th></tr></thead><tbody>${rows}</tbody></table>`,
    `<button class="btn ghost small" onclick="downloadHistory(${id})">⬇️ Baixar histórico</button>`,
    `<button class="btn ghost small" onclick="openDetail(${id})">← Voltar ao projeto</button>`);
}

async function downloadHistory(id) {
  try {
    const res = await fetch('/api/projects/' + id + '/history/download', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) return alert('Erro ao gerar o histórico.');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'historico-' + id + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (err) { alert(err.message); }
}

flyout.addEventListener('mouseenter', () => clearTimeout(hideTimer));
flyout.addEventListener('mouseleave', scheduleHide);
rail.addEventListener('mouseleave', scheduleHide);
rail.addEventListener('mouseenter', () => clearTimeout(hideTimer));
document.getElementById('railToggle')?.addEventListener('click', () => {
  rail.classList.toggle('expanded');
  document.body.classList.toggle('rail-open');
});
(async () => {
  try {
    const { company } = await api('/api/company');
    const logoEl = document.getElementById('railLogo');
    if (company.logo) logoEl.innerHTML = `<img src="/${esc(company.logo)}" alt="">`;
    const { locations: locs } = await api('/api/locations');
    const box = document.getElementById('locIcons');
    const currentLoc = new URLSearchParams(location.search).get('loc');
    locs.forEach(l => {
      const b = document.createElement('button');
      b.className = 'rail-item loc' + (currentLoc == l.id ? ' active' : '');
      b.title = l.name;
      b.innerHTML = `<span class="rail-ico">${l.image ? `<img src="${esc(l.image)}" alt="">` : esc((l.name || '?').trim()[0].toUpperCase())}</span><span class="rail-label">${esc(l.name)}</span>`;
      b.addEventListener('mouseenter', () => { clearTimeout(hideTimer); clearTimeout(hoverTimer); hoverTimer = setTimeout(() => showFlyout(l, b), 200); });
      b.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); scheduleHide(); });
      b.addEventListener('click', () => showFlyout(l, b));
      box.appendChild(b);
    });
  } catch (e) {}
})();
document.getElementById('driversBtn').addEventListener('click', () => alert('Gerenciar Motoristas chega em uma próxima etapa.'));
document.addEventListener('click', (e) => {
  if (!e.target.closest('.rail') && !e.target.closest('.flyout')) flyout.hidden = true;
});


// ===== Sino: notificações reais =====
async function loadBell() {
  try {
    const { notifications, unread } = await api('/api/notifications');
    const badge = document.getElementById('bellBadge');
    if (badge) { badge.textContent = unread; badge.hidden = unread === 0; }
    const panel = document.getElementById('notifPanel');
    if (panel && notifications.length) {
      panel.innerHTML = notifications.map(n => `
        <div class="notif-item ${n.type === 'emergency' ? 'note-emergency' : n.read ? '' : 'unread'}">
          <b>${esc(n.title)}</b>
          <p>${esc(n.body || '')}</p>
          <span class="when">${esc((n.created_at || '').slice(0, 16))}</span>
        </div>`).join('');
      panel.addEventListener('click', async () => {
        try { await api('/api/notifications/read', { method: 'POST' }); } catch (e) {}
        if (badge) { badge.textContent = '0'; badge.hidden = true; }
      }, { once: true });
    }
  } catch (e) {}
}
loadBell();
